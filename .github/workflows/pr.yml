name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch base
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Fetch external plugins
        run: node scripts/external.mjs
      - name: Update plugin index
        run: |
          set -euo pipefail
          node scripts/catalog.mjs
          git add README.md
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m "更新插件索引"
          git push origin "HEAD:${{ github.head_ref }}" || echo "无法写回 PR，校验会要求本地运行 node scripts/catalog.mjs"
      - name: Validate
        id: validate
        continue-on-error: true
        env:
          ENSO_COMMUNITY_PR: ${{ github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER' }}
        run: node scripts/validate.mjs --base "origin/${{ github.base_ref }}" --summary-out permission-summary.md
      - name: Comment permission summary
        if: always() && hashFiles('permission-summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- enso-permission-summary -->';
            const body = `${marker}\n\n${fs.readFileSync('permission-summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail when invalid
        if: steps.validate.outcome == 'failure'
        run: exit 1
