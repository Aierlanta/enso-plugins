<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="enso-ui.css" />
    <style>
      body { padding: 10px; font-size: 12px; }
      #app { display: flex; flex-direction: column; gap: 8px; }
      .card { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      h3 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
      b { font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .chats { display: flex; flex-direction: column; gap: 2px; margin: 0 -6px; }
      .chats > .row { padding: 4px 6px; border-radius: var(--radius-md); }
      .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .m { color: var(--muted-foreground); font-size: 11px; }
      .code { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: 6px; text-align: center; padding: 10px 0; border-radius: var(--radius-md); background: var(--muted); user-select: all; }
      .code > span { padding-left: 6px; }
      .ui-btn--block { width: 100%; height: 32px; }
      ol { margin: 0; padding-left: 18px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 2px; }
      label.switch { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 11px; cursor: pointer; flex: none; }
      .err { color: var(--destructive); font-size: 11px; }
      .wl { display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 8px 26px; }
      .users { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .users .ui-badge { gap: 4px; }
      .x { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; opacity: .6; font: inherit; }
      .x:hover { opacity: 1; }
      .btns { display: flex; gap: 6px; }
      .btns > .ui-btn { flex: 1; height: 32px; }
      select.ctx { height: 22px; padding: 0 4px; width: auto; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"><div class="ui-card card"><div class="ui-skeleton" style="height: 14px; width: 60%"></div></div></div>
    <script src="enso-ui.js"></script>
    <script>
      const app = document.getElementById('app');
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      let view = null;
      let error = '';
      let busy = false;
      let lastCode = '';
      ensoUI.tooltip();

      let last = '';
      let stale = false;
      // 下拉框展开时 innerHTML 重绘会把它关掉，先记着，失焦后再画
      const picking = () => document.activeElement?.tagName === 'SELECT';
      async function run(method, args) {
        if (busy) return;
        busy = true;
        let changed = true;
        try {
          const next = await window.enso.call(method, args ?? {});
          const key = JSON.stringify(next);
          // 轮询结果没变就不重绘，避免打断正在点的控件
          if (method === 'state' && key === last && !error) return (changed = false);
          last = key;
          view = next;
          error = '';
        } catch (e) {
          error = e?.message ?? String(e);
        } finally {
          busy = false;
          if (changed && method === 'state' && picking()) stale = true;
          else if (changed) render();
        }
      }
      document.addEventListener('focusout', () => setTimeout(() => {
        if (stale && !picking()) (stale = false), render();
      }));

      function render() {
        const v = view;
        if (!v) return (app.innerHTML = error ? `<div class="ui-empty err">${esc(error)}</div>` : '<div class="ui-empty">加载中…</div>');
        if (!v.configured) {
          app.innerHTML = `<div class="ui-card card ui-enter"><b>还没有 Bot Token</b>
            <ol><li>在 Telegram 找 @BotFather，发 /newbot 创建机器人</li>
            <li>复制它给的 Token</li><li>填到 设置 → 插件 → Telegram → Bot Token</li></ol></div>`;
          return;
        }
        const bot = v.bot
          ? `<div class="row"><span class="grow"><b>@${esc(v.bot.username)}</b> <span class="m">${esc(v.bot.name)}</span></span><span class="ui-badge ui-badge--success">已连接</span></div>`
          : `<div class="row"><span class="grow err">${esc(v.error)}</span><span class="ui-badge ui-badge--destructive">连不上 Telegram</span></div>`;
        let body;
        if (!v.sessionId) body = '<div class="ui-empty">打开一个会话后在这里绑定</div>';
        else {
          const sessionPick = (b) => `<label class="switch" data-tip="改绑到另一个会话，之后这个聊天的消息发到那里">会话
              <select class="ui-input ctx" data-move="${b.chatId}">${v.sessions.map((s) => `<option value="${esc(s.id)}" ${s.id === v.sessionId ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}</select></label>`;
          const whitelist = (b) => {
            if (b.chatType === 'private') return v.sessions.length > 1 ? `<div class="wl">${sessionPick(b)}</div>` : '';
            const allow = (b.allow ?? []).map((u) => `<span class="ui-badge">${esc(u.name)}<button class="x" data-tip="移出白名单" data-deny="${b.chatId}:${u.id}">×</button></span>`).join('') || '<span class="m">名单为空，群里没人能用</span>';
            const req = (b.requests ?? []).map((u) => `<span class="ui-badge ui-badge--warning">${esc(u.name)}<button class="x" data-tip="加入白名单" data-allow="${b.chatId}:${u.id}">＋</button></span>`).join('');
            const sizes = [...new Set([0, 3, 5, 10, 20, b.context ?? 0])].sort((x, y) => x - y);
            const ctx = `<label class="switch" data-tip="有人触发机器人时，附带群里此前未投递的其他人消息">附带群聊上下文
              <select class="ui-input ctx" data-ctx="${b.chatId}">${sizes.map((n) => `<option value="${n}" ${n === (b.context ?? 0) ? 'selected' : ''}>${n ? `最近 ${n} 条` : '关'}</option>`).join('')}</select></label>
              ${b.context && v.bot?.readsAll === false ? '<div class="m err">机器人开着隐私模式，只能看到 @ 它或回复它的消息。到 @BotFather 发 /setprivacy 选 Disable，再把机器人移出群重新拉进来。</div>' : ''}`;
            return `<div class="wl">${v.sessions.length > 1 ? sessionPick(b) : ''}${ctx}
              <label class="switch" data-tip="开启后只有名单内的成员能使用机器人"><input type="checkbox" class="ui-switch" data-wl="${b.chatId}" ${b.whitelist ? 'checked' : ''}/>仅白名单成员可用</label>
              ${b.whitelist ? `<div class="users">${allow}</div>${req ? `<div class="users"><span class="m">待批准：</span>${req}</div>` : ''}
              <div class="m">在群里回复某人的消息发 /allow 或 /deny 也可管理。</div>` : ''}</div>`;
          };
          const chats = v.bindings.length
            ? '<div class="chats">' + v.bindings.map((b) => `<div><div class="row" data-fill>
                <span class="grow">${b.chatType === 'private' ? '👤' : '👥'} ${esc(b.title ?? b.chatId)}</span>
                <label class="switch" data-tip="把在 EnsoCode 里的对话也发到这个聊天"><input type="checkbox" class="ui-switch" data-sync="${b.chatId}" ${b.sync ? 'checked' : ''}/>同步</label>
                <button class="ui-btn ui-btn--sm ui-btn--outline" data-fresh="${b.chatId}" data-tip="新建一个会话并把这个聊天改绑过去">新会话</button>
                <button class="ui-btn ui-btn--sm ui-btn--destructive" data-unbind="${b.chatId}">解绑</button></div>${whitelist(b)}</div>`).join('') + '</div>'
            : '<div class="m">还没有绑定聊天</div>';
          const pairing = v.pairing
            ? `<div class="code ui-mono" data-code></div>
               ${v.pairing.link ? `<div class="btns"><button class="ui-btn ui-btn--primary" data-open="${esc(v.pairing.link)}">绑定私聊</button>
                 <button class="ui-btn ui-btn--outline" data-open="${esc(v.pairing.groupLink)}" data-tip="选择一个群并把机器人加进去，自动完成绑定">绑定到群聊</button></div>` : ''}
               <div class="m">或在 Bot 私聊里发 <b>/bind ${esc(v.pairing.code)}</b>；群聊里发 <b>/bind@${esc(v.bot?.username ?? 'bot')} ${esc(v.pairing.code)}</b>。<span data-left></span></div>`
            : `<button class="ui-btn ui-btn--primary ui-btn--block" data-pair>绑定 Telegram 聊天</button>`;
          const idle = v.bindings.length && v.running === false
            ? `<div class="m">本会话还没启动，收到 Telegram 消息时会自动启动${v.queued ? `（已排队 ${v.queued} 条）` : ''}。</div>`
            : '';
          body = `<div class="ui-card card"><h3>本会话的聊天</h3>${chats}${idle}</div><div class="ui-card card">${pairing}</div>`;
        }
        const others = v.others.length && v.sessionId
          ? `<div class="ui-card card"><h3>其他会话的聊天</h3><div class="chats">${v.others.map((o) => `<div class="row" data-fill>
              <span class="grow">${o.chatType === 'private' ? '👤' : '👥'} ${esc(o.title ?? o.chatId)} <span class="m">· ${esc(o.session)}</span></span>
              <button class="ui-btn ui-btn--sm ui-btn--outline" data-pull="${o.chatId}">移到本会话</button></div>`).join('')}</div></div>`
          : '';
        app.innerHTML = `<div class="ui-card card">${bot}</div>${body}${others}${error ? `<div class="err">${esc(error)}</div>` : ''}`;
        app.querySelectorAll('.chats').forEach((el) => ensoUI.fill(el));
        const codeEl = app.querySelector('[data-code]');
        if (codeEl) {
          // innerHTML 重绘后先放回旧码，配对码变化时再做一次 TextSwap
          if (lastCode) ensoUI.swap(codeEl, lastCode);
          ensoUI.swap(codeEl, v.pairing.code);
          lastCode = v.pairing.code;
        }
        tick();
      }

      function tick() {
        const el = app.querySelector('[data-left]');
        if (!el || !view?.pairing) return;
        const s = Math.max(0, Math.round((view.pairing.expiresAt - Date.now()) / 1000));
        el.textContent = s ? ` ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} 后失效` : ' 已失效';
      }

      app.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.hasAttribute('data-pair')) run('pair');
        else if (t.dataset.unbind) run('unbind', { chatId: Number(t.dataset.unbind) });
        else if (t.dataset.pull) run('move', { chatId: Number(t.dataset.pull), sessionId: view.sessionId });
        else if (t.dataset.fresh) run('fresh', { chatId: Number(t.dataset.fresh) });
        else if (t.dataset.allow || t.dataset.deny) {
          const [chatId, userId] = (t.dataset.allow || t.dataset.deny).split(':').map(Number);
          run('allow', { chatId, userId, on: !!t.dataset.allow });
        }
        else if (t.dataset.open) window.enso.call('open', { url: t.dataset.open }).catch((err) => ((error = err.message), render()));
      });
      app.addEventListener('change', (e) => {
        const { sync, wl, ctx, move } = e.target.dataset ?? {};
        if (sync) run('sync', { chatId: Number(sync), on: e.target.checked });
        else if (wl) run('whitelist', { chatId: Number(wl), on: e.target.checked });
        else if (ctx) run('context', { chatId: Number(ctx), count: Number(e.target.value) });
        else if (move) run('move', { chatId: Number(move), sessionId: e.target.value });
      });

      run('state');
      // 跟随会话切换和后台完成的绑定；state 只读本地文件，开销很小
      setInterval(() => run('state'), 1500);
      setInterval(tick, 1000);
    </script>
  </body>
</html>
