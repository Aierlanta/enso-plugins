<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: #1f2328; --muted: #6b7280; --card: #ffffff; --bg: #f6f7f9; --line: #e5e7eb;
        --k-system: #7c3aed; --k-tools: #2563eb; --k-skills: #db2777; --k-memory: #0891b2;
        --k-files: #ca8a04; --k-results: #ea580c; --k-chat: #16a34a;
      }
      [data-theme='dark'] {
        --fg: #e6e8eb; --muted: #9aa1ab; --card: #1c1f24; --bg: #141619; --line: #2c3036;
        --k-system: #c4b5fd; --k-tools: #93c5fd; --k-skills: #f9a8d4; --k-memory: #67e8f9;
        --k-files: #fde047; --k-results: #fdba74; --k-chat: #86efac;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        color: var(--fg); background: var(--bg); font-variant-numeric: tabular-nums; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
      .head b { font-size: 18px; }
      .head .m { color: var(--muted); }
      .head .pct { margin-left: auto; font-weight: 600; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
      .stat { display: flex; flex-direction: column; gap: 2px; }
      .stat span { color: var(--muted); font-size: 11px; }
      .stat b { font-size: 13px; }
      .map { position: relative; width: 100%; aspect-ratio: 1.6 / 1; min-height: 140px; }
      .tile { position: absolute; overflow: hidden; padding: 6px 8px; border-radius: 7px; display: flex; flex-direction: column; gap: 1px;
        background: color-mix(in srgb, var(--k) 12%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 28%, transparent);
        transition: left .5s, top .5s, width .5s, height .5s; }
      .tile .n { font-size: 11.5px; font-weight: 600; color: color-mix(in srgb, var(--k) 72%, var(--fg)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile .v { font-size: 10.5px; color: color-mix(in srgb, var(--k) 40%, var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile.low .v { display: none; }
      .tile.bare > * { visibility: hidden; }
      .tile.free { --k: var(--fg); background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--fg) 6%, transparent) 0 1px, transparent 1px 6px), var(--card);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 10%, transparent); }
      .tile.free .n { color: var(--muted); font-weight: 500; }
      .tile.item { background: color-mix(in srgb, var(--k) 8%, var(--card)); }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
      .row, ul.items > li { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .part > .row { cursor: default; }
      .part > .row[title] { cursor: pointer; }
      .grow { flex: 1; }
      .p { color: var(--muted); width: 38px; text-align: right; flex: none; }
      .c { color: var(--muted); font-size: 11px; }
      .caret { width: 8px; flex: none; color: var(--muted); transition: transform .15s; }
      .part.open > .row .caret { transform: rotate(90deg); }
      ul.items { display: none; margin: 4px 0 2px 14px; gap: 3px; }
      .part.open > ul.items { display: flex; }
      ul.items > li { font-size: 11.5px; }
      .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .name b { font-weight: 500; }
      .name small { color: var(--muted); margin-left: 4px; }
      .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; flex: none; }
      i.dot { width: 8px; height: 8px; border-radius: 2.5px; background: var(--k); flex: none; }
      i.dot.free { background: color-mix(in srgb, var(--fg) 10%, transparent); }
      .note { color: var(--muted); font-size: 11px; }
      .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
      .tip { position: fixed; z-index: 10; min-width: 180px; max-width: min(280px, calc(100vw - 20px)); padding: 8px 10px; border-radius: 9px;
        background: #17171b; color: #ededf1; box-shadow: 0 10px 30px rgba(0, 0, 0, .28); font-size: 11.5px; pointer-events: none;
        display: flex; flex-direction: column; gap: 3px; }
      .tip[hidden] { display: none; }
      .tip-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-weight: 600; }
      .tip-head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tip-head span:last-child { color: #a1a1aa; font-weight: 400; white-space: nowrap; }
      .tip-sub { color: #a1a1aa; font-size: 11px; word-break: break-all; }
      .tip-row { display: flex; gap: 10px; color: #b9b9c1; }
      .tip-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tip-more { color: #85858d; font-size: 10.5px; }
      [data-tip] { cursor: default; }
      .part > .row[data-tip] { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="context.js"></script>
  </body>
</html>
